name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS and Windows now build and pass their suites, so this flag is no
    # longer hiding a failure -- it is holding the door open while they are
    # still unproven in a host. Take it off each platform as that platform earns
    # it, and never use it to make a genuine breakage look green.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            experimental: false
          # Both build and pass the full unit suite. They are still marked
          # experimental because nothing has yet *loaded* the plugin in a host
          # on either -- no window opened, no device opened, no jam joined --
          # and because the accessibility audit is excluded on them for want of
          # a window session. "Builds and tests clean" is a real result and the
          # name should say so; it is not the same as "supported".
          - name: macOS (build only, untested in a host)
            os: macos-latest
            experimental: true
          - name: Windows (build only, untested in a host)
            os: windows-latest
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # -g on top of Release, rather than RelWithDebInfo: the optimisation level
      # stays exactly what ships, so timing-dependent faults are not perturbed
      # by the act of observing them, while any core or attached debugger still
      # has symbols. AGENTS.md is right that gdb on a build without -g is
      # address soup, and that cost a round trip here.
      - name: Configure (Linux and macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_FLAGS=-g -DCMAKE_C_FLAGS=-g
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF
        shell: bash

      # Deliberately no -G here. With Ninja on a Windows runner, CMake picks up
      # whichever compiler is on PATH, which is MinGW g++ -- and JUCE refuses to
      # build under MinGW outright ("MinGW is not supported"). Letting CMake
      # choose its default generator gets Visual Studio and MSVC instead.
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_BUILD_EXAMPLES=OFF -DJUCE_BUILD_EXTRAS=OFF

      - name: Build
        run: cmake --build build --config Release -j 4

      # THE ACCESSIBILITY AUDIT DOES NOT RUN IN CI ON ANY PLATFORM. Read that
      # again before trusting a green tick here, and see CONTRIBUTING.md: it is
      # a gate you run locally, and CI cannot cover for you.
      #
      # Why, per platform:
      #   macOS, Windows -- segfaults in the window peer. Those runners have no
      #     window session for a real JUCE component tree to attach to.
      #   Linux -- hangs in teardown, near-deterministically under ctest. Not
      #     the audit's own work, which completes and reports zero findings, but
      #     ~juce::Thread() destroying a WaitableEvent while the thread it
      #     belongs to is still unwinding, which blocks in pthread_cond_destroy
      #     on the runner's glibc 2.39. ROADMAP.md carries the stack.
      #
      # Things tried and measured, so they are not tried again blind: retrying
      # on timeout (three attempts, three timeouts); running under xvfb so the
      # audit had a real X server (identical hang, so the display was never
      # involved); replacing juce::Thread with std::thread; and skipping the
      # destructor. The last two traded a hang for a segfault.
      #
      # This exclusion comes off the moment the race is fixed. It is the one
      # check standing between a screen-reader user and an unnamed control, and
      # leaving it uncovered is a debt, not a decision we are happy with.
      - name: Test (the GUI audit is excluded -- see above)
        run: ctest --test-dir build -C Release --output-on-failure -E accessibility-audit

      # There used to be a second, direct invocation of AntiphonAudit here, to
      # print the report. It ran the same binary ctest had just run, and it had
      # no timeout -- so when the audit hung, this step sat there for ten
      # minutes. ctest carries a 120s TIMEOUT on the test and prints the report
      # under --output-on-failure, which is the same information with a bound on
      # it. Do not reintroduce an unbounded second run.

      - name: Upload artefacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Antiphon-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            build/src/Antiphon_artefacts/**/VST3/*.vst3
            build/src/Antiphon_artefacts/**/CLAP/*.clap
            build/src/Antiphon_artefacts/**/Standalone/*

  lint:
    name: Format and tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libcurl4-openssl-dev \
            libgl1-mesa-dev libglu1-mesa-dev ninja-build clang-tidy

      # Pinned, and installed from PyPI rather than apt, because clang-format
      # is not stable across major versions: v18 and v20 disagree about `({})`
      # as a call argument, which is enough to fail a gate on code neither
      # author nor reviewer touched. apt gives whatever the runner image ships
      # (18 on ubuntu-latest today), so the version has to be stated. Keep this
      # in step with CONTRIBUTING.md, which tells contributors to install the
      # same one.
      - name: Install clang-format
        run: pip install "clang-format==20.1.8"

      # Blocking. The configuration is LLVM's defaults, which is what this
      # codebase was already written in, so a failure here means a file was
      # edited without running clang-format rather than a disagreement about
      # style -- provided the versions match, which is what the pin is for.
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror \
            src/*.cpp src/*.h test/*.cpp test/*.h tools/*.cpp

      - name: Configure (for the compile database)
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Advisory, deliberately. See ROADMAP.md, "Clear the clang-tidy backlog":
      # 142 findings at adoption. This becomes blocking -- with
      # WarningsAsErrors restored in .clang-tidy -- in the same commit that
      # takes the count to zero, and not before.
      - name: clang-tidy (advisory)
        continue-on-error: true
        run: |
          clang-tidy -p build --quiet src/*.cpp tools/*.cpp 2>&1 | tee tidy.log
          echo "findings: $(grep -cE 'warning:|error:' tidy.log || true)"
