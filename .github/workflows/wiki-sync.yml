name: Sync documentation to the wiki

on:
  push:
    branches: [main]
    paths:
      - "website/docs/**"
      - ".github/scripts/wiki_transform.py"
      - ".github/workflows/wiki-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone the wiki
        run: |
          git clone \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git \
            wiki-repo

      # The wiki is generated, never hand-edited, so stale pages are removed
      # rather than left behind when a doc is renamed or deleted.
      - name: Copy the docs across
        run: |
          find wiki-repo -maxdepth 1 -name '*.md' -delete
          cp website/docs/*.md wiki-repo/

      - name: Transform for the wiki
        run: python3 .github/scripts/wiki_transform.py wiki-repo

      - name: Commit and push
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No changes to sync."
          else
            git commit -m "Sync docs from ${{ github.sha }} [skip ci]"
            git push origin HEAD
          fi
