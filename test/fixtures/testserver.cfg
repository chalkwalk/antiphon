# Local Ninjam server for integration testing.
#
# Used by scripts/testserver.sh. The point of this configuration is the
# SessionArchive: the server writes every interval it receives to disk,
# verbatim, one Ogg file per user per channel per interval, plus a
# clipsort.log manifest. That gives a byte-exact capture of what each client
# put on the wire -- ours next to a known-good one, under identical conditions.

Port 2049

# "multi" is required: without it two clients from 127.0.0.1 collide and the
# second is rejected.
AnonymousUsers multi
AnonymousUsersCanChat yes

# Second number is the per-anonymous-user channel cap. The stock sample config
# sets it to 2, which is too low as soon as you add a channel in the UI.
MaxChannels 32 32

MaxUsers 8

# Deterministic tempo so archived interval lengths are predictable:
# 8 beats at 120 bpm = 4.000 s = 192000 samples at 48 kHz.
DefaultBPI 8
DefaultBPM 120
DefaultTopic "ninjam plugin integration test"

# ServerLicense is deliberately NOT set. When it is, the server waits for a
# licence-agreement handshake that this client does not implement, and login
# hangs with no error.
# ServerLicense cclicense.txt

# Archive every interval. Second value is the session length in minutes; keep
# it long enough that a whole test run lands in one session directory.
SessionArchive /tmp/njarchive 60

# No LogFile line, so the event log goes to stdout where the harness can see it.

ACL 0.0.0.0/0 allow
